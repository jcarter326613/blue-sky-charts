service: adds-data-collection
provider:
  name: aws
  runtime: nodejs12.x
  memorySize: 256
  timeout: 5
  iamRoleStatements:
    - Effect: 'Allow'
      Action:
        - 's3:PutObject'
        - 's3:PutObjectAcl'
      Resource:
        - 'arn:aws:s3:::vfr-green-artifacts-245819277863/*'

functions:
  collect:
    handler: src/main/index.handler
    events:
      - http: GET handler

package:
  exclude:
    - src/*.ts
    - src/test
    - package.json
    - package-lock.json
    - README.md
    - tsconfig.json
    - compile
    - deploy