service: airport-condition-server
provider:
  name: aws
  runtime: nodejs12.x
  memorySize: 512
  timeout: 4
  iamRoleStatements:
    - Effect: 'Allow'
      Action:
        - 'ses:SendEmail'
        - 'ses:SendRawEmail'
      Resource:
        - '*'

functions:
  submitSupportRequest:
    handler: src/main/index.handler
    events:
      - http: GET submitSupportRequest

package:
  exclude:
    - src/*.ts
    - src/test
    - package.json
    - package-lock.json
    - README.md
    - tsconfig.json
    - compile
    - deploy
