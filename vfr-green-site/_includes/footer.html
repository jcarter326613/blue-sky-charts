<!-- no footer at all! -->
<footer class="bg-light py-5">
  <div class="container">
    <div class="small text-center text-muted footer">
      <div>
        {% for link in site.data.footer.links %}
          <div>
            <a href="{{ link.url }}" {% assign new_window_is_not_empty = link.new_window | is_not_empty %}
            {% if new_window_is_not_empty %}target="_blank" rel="noopener"
            {% endif %}>{{ link.text }}</a>
          </div>
        {% endfor %} 
      </div>
      <div>
          <div>&copy; Muddy Paw Cloud Technology LLC</div>
          <div>Chichester, New Hampshire</div>
      </div>
    </div>
  </div>
</footer>
