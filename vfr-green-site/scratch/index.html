<html>
    <head>
        <meta charset="utf-8">
        <script src="https://cesium.com/downloads/cesiumjs/releases/1.68/Build/Cesium/Cesium.js"></script>
        <link href="https://cesium.com/downloads/cesiumjs/releases/1.68/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    </head>
    <body>
        <div id="cesiumContainer"></div>
        <script>
            var viewer = new Cesium.Viewer('cesiumContainer', {
                animation: false,
                imageryProvider: new Cesium.UrlTemplateImageryProvider({
                    url : 'http://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'
                }),
                baseLayerPicker: false,
                fullscreenButton: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                screenModePicker: false,
                selectionIndicator: false,
                timeline: false,
                navigationHelpButton: false,
                navigationInstructionsInitiallyVisible: false,
                scene3DOnly: true
            });
            viewer.scene.screenSpaceCameraController.enableTilt = false;
            var credit = new Cesium.Credit('Title', '../images/facility.gif', 'http://www.cesiumjs.org');
            viewer.scene.frameState.creditDisplay.addDefaultCredit(credit)
        </script>
    </body>
</html>
