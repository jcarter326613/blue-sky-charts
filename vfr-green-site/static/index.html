<html>
    <head>
        <title>Blue Sky Charts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/main.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <style>
            .header {
                background-color: rgb(62,101,238)
            }
            .header h1 {
                font-size: 100px;
                margin-top: .4em;
                margin-bottom: .6em;
                color: white;
            }
            .header .focusButton {
                margin-bottom: 4em;
            }
            .featureHeader {
                text-align: center;
                font-size: 50px;
                font-weight: bold;
            }
            .featureExample {
                text-align: center;
            }
            .featureExample img {
                margin: 10px;
            }
            @media screen and (max-width: 400px) {
                .header h1 {
                    font-size: 25vw;
                }
            }
        </style>
        <script>
            $(document).ready(() => {
                $(".viewChartButton").click((e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = "/chart";
                })
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Blue Sky Charts</h1>
            <div class="focusButton"><div class="viewChartButton">View the charts</div></div>
        </div>
        <div>
            <div class="featureHeader">Review graphical metar data</div>
            <div class="featureExample">
                <img src="examples/ceiling_example.jpg" alt="Ceiling overlay on VFR map" width="400" height="400">
                <img src="examples/wind_example.jpg" alt="Surface wind barbs on VFR map" width="400" height="400">
            </div>
        </div>
    </body>
</html>
